<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Taschenrechner</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
      font-family: Arial, sans-serif;
    }
    .calculator {
      background: #222;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      width: 260px;
    }
    .display {
      width: 100%;
      height: 40px;
      margin-bottom: 10px;
      font-size: 24px;
      text-align: right;
      padding: 5px;
      border: none;
      border-radius: 4px;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-gap: 10px;
    }
    button {
      height: 40px;
      font-size: 18px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .operator {
      background: #ff9500;
      color: white;
    }
    .clear {
      background: #d9534f;
      color: white;
      grid-column: span 2;
    }
    .equals {
      background: #5cb85c;
      color: white;
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input type="text" class="display" id="display" readonly>
    <div class="buttons">
      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="operator">/</button>
      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button class="operator">*</button>
      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button class="operator">-</button>
      <button>0</button>
      <button>.</button>
      <button class="operator">+</button>
      <button class="clear">C</button>
      <button class="equals">=</button>
    </div>
  </div>
  <script>
    const display = document.getElementById('display');
    document.querySelectorAll('.buttons button').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.textContent;
        if (val === 'C') {
          display.value = '';
        } else if (val === '=') {
          try {
            display.value = eval(display.value || '0');
          } catch (e) {
            display.value = 'Error';
          }
        } else {
          display.value += val;
        }
      });
    });
  </script>
</body>
</html>
